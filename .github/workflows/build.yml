name: Build Project Wizard

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: Package VSIX
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Package extension
        id: vsix
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match package version v$version." >&2
            exit 1
          fi
          filename="project-wizard-$version.vsix"
          npm run package -- --out "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: project-wizard-vsix
          path: ${{ steps.vsix.outputs.filename }}
          if-no-files-found: error
    outputs:
      filename: ${{ steps.vsix.outputs.filename }}

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: project-wizard-vsix
      - name: Publish VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VSIX: ${{ needs.package.outputs.filename }}
        run: |
          if assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.state == "uploaded") | .name'); then
            if grep -Fxq -- "$VSIX" <<< "$assets"; then
              echo "$VSIX is already attached to $GITHUB_REF_NAME."
            else
              gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" --verify-tag --generate-notes
          fi
