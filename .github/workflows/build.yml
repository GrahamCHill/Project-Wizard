name: Build Project Wizard

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: Package VSIX
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Package extension
        id: vsix
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match package version v$version." >&2
            exit 1
          fi
          filename="project-wizard-$version.vsix"
          npm run package -- --out "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: project-wizard-vsix
          path: ${{ steps.vsix.outputs.filename }}
          if-no-files-found: error
    outputs:
      filename: ${{ steps.vsix.outputs.filename }}
      tag: ${{ steps.vsix.outputs.tag }}

  release:
    name: Publish GitHub release
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.package.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: project-wizard-vsix
      - name: Publish VSIX
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VSIX: ${{ needs.package.outputs.filename }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          target=$(git rev-parse HEAD)
          if tagged=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            if [[ "$tagged" != "$target" ]]; then
              echo "$TAG already points to $tagged. Bump the package version to release this commit."
              exit 0
            fi
            create_options=(--verify-tag)
          else
            create_options=(--target "$target")
          fi
          if release=$(gh release view "$TAG" --json assets,isDraft,targetCommitish); then
            if [[ -z "$tagged" ]] && ! jq -e --arg commit "$target" '.targetCommitish == $commit' <<< "$release" >/dev/null; then
              echo "The draft for $TAG targets a different commit." >&2
              exit 1
            fi
            if jq -e --arg asset "$VSIX" 'any(.assets[]; .name == $asset and .state == "uploaded")' <<< "$release" >/dev/null; then
              echo "$VSIX is already attached to $TAG."
            else
              gh release upload "$TAG" "$VSIX" --clobber
            fi
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              gh release edit "$TAG" --draft=false
            fi
          else
            gh release create "$TAG" "$VSIX" "${create_options[@]}" --generate-notes
          fi
