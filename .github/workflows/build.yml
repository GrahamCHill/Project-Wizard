name: Build Project Wizard

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: Package VS Code and CLion plugins
    needs: test
    runs-on: ubuntu-latest
    env:
      CLION_VERSION: '2026.2.4'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Package VS Code extension
        id: vsix
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match package version v$version." >&2
            exit 1
          fi
          filename="project-wizard-$version.vsix"
          npm run package -- --out "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: project-wizard-vsix
          path: ${{ steps.vsix.outputs.filename }}
          if-no-files-found: error
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v5
        id: clion-sdk
        with:
          path: |
            ${{ runner.temp }}/clion-sdk/lib
            ${{ runner.temp }}/clion-sdk/product-info.json
          key: clion-sdk-${{ runner.os }}-${{ runner.arch }}-${{ env.CLION_VERSION }}
      - name: Download the CLion SDK
        if: steps.clion-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/clion-sdk"
          curl --fail --location --show-error --silent --retry 3 \
            "https://download.jetbrains.com/cpp/CLion-$CLION_VERSION.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/clion-sdk"
      - name: Package CLion plugin
        id: clion
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          npm run package:clion -- --ide "$RUNNER_TEMP/clion-sdk"
          echo "filename=project-wizard-clion-$version.zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: project-wizard-clion
          path: clion/build/${{ steps.clion.outputs.filename }}
          if-no-files-found: error
    outputs:
      vsix: ${{ steps.vsix.outputs.filename }}
      clion: ${{ steps.clion.outputs.filename }}
      tag: ${{ steps.vsix.outputs.tag }}

  release:
    name: Publish GitHub release
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.package.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: project-wizard-vsix
      - uses: actions/download-artifact@v8
        with:
          name: project-wizard-clion
      - name: Publish both plugins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VSIX: ${{ needs.package.outputs.vsix }}
          CLION_ZIP: ${{ needs.package.outputs.clion }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          target=$(git rev-parse HEAD)
          if tagged=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            if [[ "$tagged" != "$target" ]]; then
              echo "$TAG already points to $tagged. Bump the package version to release this commit."
              exit 0
            fi
            create_options=(--verify-tag)
          else
            create_options=(--target "$target")
          fi
          if release=$(gh release view "$TAG" --json assets,isDraft,targetCommitish); then
            if [[ -z "$tagged" ]] && ! jq -e --arg commit "$target" '.targetCommitish == $commit' <<< "$release" >/dev/null; then
              echo "The draft for $TAG targets a different commit." >&2
              exit 1
            fi
            for asset in "$VSIX" "$CLION_ZIP"; do
              if jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .state == "uploaded")' <<< "$release" >/dev/null; then
                echo "$asset is already attached to $TAG."
              else
                gh release upload "$TAG" "$asset" --clobber
              fi
            done
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              gh release edit "$TAG" --draft=false
            fi
          else
            gh release create "$TAG" "$VSIX" "$CLION_ZIP" "${create_options[@]}" --generate-notes
          fi
