services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm:22m}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:0.5b}
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./docs:/app/docs:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
  ollama:
    image: alpine/ollama:0.40.6
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  models:
