---
- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow inbound ports through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ common_firewall_allowed_ports }}"

- name: Deny other inbound traffic and enable the firewall
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
