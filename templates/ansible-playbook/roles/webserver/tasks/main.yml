---
- name: Install NGINX
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Publish the home page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"

- name: Allow HTTP through the firewall
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Start NGINX and enable it at boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
