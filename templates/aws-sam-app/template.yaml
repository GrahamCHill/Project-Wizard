AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: __PROJECT_NAME__ - an HTTP API on AWS Lambda with a DynamoDB table.

Parameters:
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: How many days to keep the function's logs.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref ItemsTable
        LOG_LEVEL: INFO

Resources:
  ItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Handles every route of the items API.
      CodeUri: src/
      Handler: app.handler
      LoggingConfig:
        LogGroup: !Ref ItemsFunctionLogs
      # SAM expands this policy template to read and write only this table.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
      Events:
        ListItems:
          Type: HttpApi
          Properties:
            Path: /items
            Method: GET
        CreateItem:
          Type: HttpApi
          Properties:
            Path: /items
            Method: POST
        GetItem:
          Type: HttpApi
          Properties:
            Path: /items/{id}
            Method: GET

  ItemsFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays

  ItemsTable:
    Type: AWS::DynamoDB::Table
    # Delete lets `sam delete` remove everything. Change both to Retain for a table that holds real data.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API.
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  TableName:
    Description: Name of the DynamoDB table.
    Value: !Ref ItemsTable
