<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__PROJECT_NAME__ settings</title>
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { margin: 16px; max-width: 28rem; }
    label { display: block; margin: 12px 0; }
    input[type="number"] { width: 6rem; }
    #saved { min-height: 1.4em; }
  </style>
</head>
<body>
  <h1>__PROJECT_NAME__ settings</h1>
  <form id="form">
    <label><input id="showBadge" type="checkbox"> Show the word count on the toolbar icon</label>
    <label>Reading speed, in words per minute
      <input id="wordsPerMinute" type="number" min="50" max="1000" step="10" required>
    </label>
    <button type="submit">Save</button>
    <p id="saved" role="status"></p>
  </form>
  <script src="../shared/api.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
