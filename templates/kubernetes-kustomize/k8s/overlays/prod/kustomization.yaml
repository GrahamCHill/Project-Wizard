apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - ../../base
  - horizontalpodautoscaler.yaml

labels:
  - pairs:
      app.kubernetes.io/environment: prod

replicas:
  - name: web
    count: 3

# Pin the image used in production here instead of editing the base.
images:
  - name: nginxinc/nginx-unprivileged
    newTag: stable-alpine
