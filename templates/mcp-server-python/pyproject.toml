[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "app-__PROJECT_SLUG__"
version = "0.1.0"
description = "A Model Context Protocol server with tools, a resource, and a prompt."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
"__PROJECT_SLUG__" = "mcp_app.server:main"

[tool.setuptools.packages.find]
where = ["src"]
